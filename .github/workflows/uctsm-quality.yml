name: UCTSM protocol quality

on:
  pull_request:
    paths: ['backend/**', 'deploy/**', 'docs/runbooks/**', '.github/workflows/uctsm-quality.yml']
  push:
    paths: ['backend/**', 'deploy/**', 'docs/runbooks/**', '.github/workflows/uctsm-quality.yml']
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        description: Engineering checks or clinical release evidence (fails without signed gold)
        options: [clinical, engineering]
        default: clinical

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MONGO_URL: mongodb://127.0.0.1:27017/?replicaSet=rs0
      DB_NAME: mtb_quality_ci_offline
      GATE_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'engineering' }}
    defaults:
      run:
        working-directory: backend
    steps:
      # Immutable official action tags verified when this workflow was authored.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install offline evaluation dependencies
        run: python -m pip install -r quality-requirements.txt
      - name: Validate scorer and safety contracts
        run: python -m pytest -q tests/test_pdf_quality.py tests/test_pdf_graph_integrity.py tests/test_architecture_boundaries.py
      - name: Validate operability contracts (alerts, routes, runbooks, release criteria, security posture)
        run: python -m pytest -q tests/test_pdf_monitoring.py tests/test_pdf_release.py tests/test_pdf_security.py
      - name: Verify checked-in fixture determinism
        run: |
          python -m app.quality.engineering_corpus
          git diff --exit-code -- quality_corpus
      - name: Evaluate exact fields and deterministic schedules
        run: >-
          python -m app.quality
          --corpus quality_corpus/manifest.json
          --predictions quality_corpus/predictions.json
          --thresholds quality_corpus/thresholds.json
          --source-root .. --mode "$GATE_MODE"
          --output ../quality-artifacts/report.json
          --baseline quality_corpus/baseline_report.json
      - name: Retain inspectable synthetic quality result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: uctsm-quality-${{ github.run_id }}
          path: quality-artifacts/
          if-no-files-found: warn
          retention-days: 14
